<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — HGM</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">HGM</div>
    <div class="auth-title">Reset password</div>

    <form id="resetForm">
      <div class="field">
        <label for="token">Token from Node-RED log</label>
        <input type="text" id="token" required>
      </div>
      <div class="field">
        <label for="newPassword">New password (min 6 chars)</label>
        <input type="password" id="newPassword" required minlength="6">
      </div>
      <div class="field">
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" required minlength="6">
      </div>
      <div class="auth-msg" id="msg"></div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Reset password</button>
    </form>

    <div class="auth-links">
      <a href="login.html">Back to login</a>
      <span></span>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
// Fill the token from the page link
const params = new URLSearchParams(window.location.search);
if (params.get("token")) {
  document.getElementById("token").value = params.get("token");
}

document.getElementById("resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  const btn = document.getElementById("submitBtn");
  msg.textContent = "";
  msg.className = "auth-msg";

  const newPassword = document.getElementById("newPassword").value;
  const confirm = document.getElementById("confirm").value;
  if (newPassword !== confirm) {
    msg.textContent = "Passwords do not match";
    msg.className = "auth-msg error";
    return;
  }

  btn.disabled = true;
  try {
    const res = await fetch(API_BASE + "/api/auth/reset-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        token: document.getElementById("token").value.trim(),
        newPassword: newPassword,
      }),
    });
    const data = await res.json();

    if (!res.ok || !data.ok) {
      msg.textContent = data.error || "Password reset failed";
      msg.className = "auth-msg error";
      return;
    }

    msg.textContent = "Success! Redirecting to login…";
    msg.className = "auth-msg success";
    setTimeout(() => (window.location.href = "login.html"), 1200);
  } catch (err) {
    msg.textContent = "Could not connect to Node-RED (" + API_BASE + ")";
    msg.className = "auth-msg error";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
