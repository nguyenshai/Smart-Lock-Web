<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — HGM</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">HGM</div>
    <div class="auth-title">Smart Lock login</div>

    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <div class="auth-msg" id="msg"></div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Login</button>
    </form>

    <div class="auth-links">
      <a href="register.html">Create account</a>
      <a href="forgot-password.html">Forgot password?</a>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  const btn = document.getElementById("submitBtn");
  msg.textContent = "";
  msg.className = "auth-msg";
  btn.disabled = true;

  try {
    const controller = new AbortController();
    const requestTimeout = setTimeout(() => controller.abort(), 15000);
    const res = await fetch(API_BASE + "/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
      }),
      signal: controller.signal,
    });
    clearTimeout(requestTimeout);
    const responseText = await res.text();
    let data;
    try {
      data = JSON.parse(responseText);
    } catch (parseError) {
      data = { ok: false, error: responseText || ("HTTP " + res.status) };
    }

    if (res.status === 404) {
      msg.textContent = "Node-RED đang chạy nhưng chưa Deploy flow / không có API /api/auth/login (HTTP 404)";
      msg.className = "auth-msg error";
      return;
    }

    if (!res.ok || !data.ok) {
      msg.textContent = data.error || "Login failed";
      msg.className = "auth-msg error";
      return;
    }

    setSession(data.token, data.user);
    window.location.href = "index.html";
  } catch (err) {
    msg.textContent = err.name === "AbortError"
      ? "Node-RED/Firebase không phản hồi sau 15 giây. Kiểm tra Debug Node-RED và Firebase."
      : "Không kết nối được Node-RED (" + API_BASE + "). Hãy kiểm tra Node-RED hoặc địa chỉ API.";
    msg.className = "auth-msg error";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
