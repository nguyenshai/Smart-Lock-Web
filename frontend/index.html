<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HGM Smart Lock</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="page">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">HGM</span>
      <span class="brand-name">Smart Lock</span>
    </div>
    <div class="navbar">
      <span class="nav-user" id="navUser"></span>
      <a href="admin.html" class="nav-link" id="adminLink" style="display:none">Account admin</a>
      <div class="conn" id="connIndicator">
        <span class="conn-dot" id="connDot"></span>
        <span id="connLabel">Connecting…</span>
      </div>
      <button class="btn btn-ghost" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="grid">

    <section class="card card-status">
      <div class="card-label">Door status</div>
      <div class="status-row">
        <span class="status-badge" id="stateBadge">—</span>
        <span class="status-meta" id="stateMeta">No data</span>
      </div>
      <div class="status-detail" id="stateDetail">
        <div><span class="detail-key">Method</span><span class="detail-val" id="methodVal">—</span></div>
        <div><span class="detail-key">User</span><span class="detail-val" id="userVal">—</span></div>
        <div><span class="detail-key">Updated</span><span class="detail-val" id="timeVal">—</span></div>
      </div>
    </section>

    <section class="card card-controls">
      <div class="card-label">Remote control</div>
      <button class="btn btn-primary" id="unlockBtn">
        Unlock door
      </button>

      <div class="lockdown-row">
        <div>
          <div class="lockdown-title">Lockdown mode</div>
          <div class="lockdown-desc">Fingerprint only</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="lockdownToggle">
          <span class="switch-track"></span>
        </label>
      </div>
      <div class="feedback" id="feedback"></div>
    </section>

    <section class="card card-history">
      <div class="card-label">Access history</div>
      <table class="history-table">
        <thead>
          <tr><th>Time</th><th>User</th><th>Method</th></tr>
        </thead>
        <tbody id="historyBody">
          <tr><td colspan="3" class="empty-row">No history yet</td></tr>
        </tbody>
      </table>
    </section>

  </main>
</div>

<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
