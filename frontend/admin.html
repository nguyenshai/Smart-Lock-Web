<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản trị — HGM</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="page">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">HGM</span>
      <span class="brand-name">Quản lý tài khoản</span>
    </div>
    <div class="navbar">
      <span class="nav-user" id="navUser"></span>
      <a href="index.html" class="nav-link">Về dashboard</a>
      <button class="btn btn-ghost" id="logoutBtn">Đăng xuất</button>
    </div>
  </header>

  <main class="admin-layout">

    <section class="card">
      <div class="card-label">Danh sách tài khoản</div>
      <ul class="user-list" id="userList">
        <li class="empty-row">Đang tải…</li>
      </ul>
    </section>

    <section class="card">
      <div class="card-label" id="credLabel">Chọn một tài khoản bên trái</div>

      <form class="cred-form" id="credForm" style="display:none">
        <div class="field">
          <label for="credType">Loại</label>
          <select id="credType">
            <option value="fingerprint">Vân tay</option>
            <option value="rfid">Thẻ RFID</option>
            <option value="ble">BLE (MAC điện thoại)</option>
            <option value="pin">Mã PIN</option>
          </select>
        </div>
        <div class="field">
          <label for="credValue">Giá trị</label>
          <input type="text" id="credValue" placeholder="VD: 04A3B2C1" required>
        </div>
        <div class="field">
          <label for="credLabelInput">Ghi chú</label>
          <input type="text" id="credLabelInput" placeholder="VD: Ngón trỏ phải">
        </div>
        <button type="submit" class="btn btn-primary btn-small">Thêm</button>
      </form>

      <table class="history-table" id="credTable" style="display:none">
        <thead>
          <tr><th>Loại</th><th>Giá trị</th><th>Ghi chú</th><th></th></tr>
        </thead>
        <tbody id="credBody"></tbody>
      </table>
    </section>

  </main>
</div>

<script src="auth.js"></script>
<script>
requireAdmin();

const currentUser = getUser();
document.getElementById("navUser").textContent = currentUser.username + " (admin)";
document.getElementById("logoutBtn").addEventListener("click", logout);

const userList = document.getElementById("userList");
const credLabel = document.getElementById("credLabel");
const credForm = document.getElementById("credForm");
const credTable = document.getElementById("credTable");
const credBody = document.getElementById("credBody");

let selectedUserId = null;

const typeLabel = {
  fingerprint: "Vân tay",
  rfid: "Thẻ RFID",
  ble: "BLE",
  pin: "Mã PIN",
};

async function loadUsers() {
  try {
    const res = await apiFetch("/api/users");
    const users = await res.json();
    if (!Array.isArray(users) || users.length === 0) {
      userList.innerHTML = '<li class="empty-row">Chưa có tài khoản</li>';
      return;
    }
    userList.innerHTML = users.map((u) => `
      <li data-id="${u.id}">
        ${u.username} <span style="color:var(--text-muted)">· ${u.role}</span>
      </li>
    `).join("");

    userList.querySelectorAll("li[data-id]").forEach((li) => {
      // Firebase dung ID dang chuoi (VD: -OExxxxxxxxx) - KHONG duoc parseInt(),
      // parseInt se pha vong id nay thanh NaN vi no bat dau bang dau "-" roi toi chu cai.
      li.addEventListener("click", () => selectUser(li, li.dataset.id, li.textContent.trim()));
    });
  } catch (err) {
    userList.innerHTML = '<li class="empty-row">Không tải được danh sách</li>';
  }
}

function selectUser(li, userId, label) {
  userList.querySelectorAll("li").forEach((el) => el.classList.remove("active"));
  li.classList.add("active");
  selectedUserId = userId;
  credLabel.textContent = "Thông tin xác thực của: " + label;
  credForm.style.display = "grid";
  credTable.style.display = "table";
  loadCredentials();
}

async function loadCredentials() {
  if (!selectedUserId) return;
  try {
    const res = await apiFetch(`/api/users/${selectedUserId}/credentials`);
    const creds = await res.json();
    if (!Array.isArray(creds) || creds.length === 0) {
      credBody.innerHTML = '<tr><td colspan="4" class="empty-row">Chưa có thông tin xác thực nào</td></tr>';
      return;
    }
    credBody.innerHTML = creds.map((c) => `
      <tr>
        <td>${typeLabel[c.type] || c.type}</td>
        <td>${c.credential_value}</td>
        <td>${c.label || "—"}</td>
        <td><button class="btn btn-danger btn-small" data-cred-id="${c.id}">Xóa</button></td>
      </tr>
    `).join("");

    credBody.querySelectorAll("button[data-cred-id]").forEach((btn) => {
      btn.addEventListener("click", () => deleteCredential(btn.dataset.credId));
    });
  } catch (err) {
    credBody.innerHTML = '<tr><td colspan="4" class="empty-row">Không tải được</td></tr>';
  }
}

credForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!selectedUserId) return;

  try {
    const res = await apiFetch(`/api/users/${selectedUserId}/credentials`, {
      method: "POST",
      body: JSON.stringify({
        type: document.getElementById("credType").value,
        value: document.getElementById("credValue").value.trim(),
        label: document.getElementById("credLabelInput").value.trim(),
      }),
    });
    const data = await res.json();

    if (!res.ok || !data.ok) {
      alert(data.error || "Không thêm được (server trả lỗi, kiểm tra tab Debug của Node-RED)");
      return;
    }

    document.getElementById("credValue").value = "";
    document.getElementById("credLabelInput").value = "";
    loadCredentials();
  } catch (err) {
    alert("Không gọi được API, kiểm tra Node-RED có đang chạy và CORS đã bật chưa");
  }
});

async function deleteCredential(credId) {
  if (!confirm("Xóa thông tin xác thực này?")) return;
  try {
    await apiFetch(`/api/credentials/${credId}`, { method: "DELETE" });
    loadCredentials();
  } catch (err) {
    alert("Không xóa được, kiểm tra kết nối Node-RED");
  }
}

loadUsers();
</script>
</body>
</html>
