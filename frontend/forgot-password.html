<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — HGM</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">HGM</div>
    <div class="auth-title">Forgot password</div>

    <form id="forgotForm">
      <div class="field">
        <label for="email">Registered email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="auth-msg" id="msg"></div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Send reset request</button>
    </form>

    <p style="font-size:12px;color:var(--text-muted);margin-top:14px;line-height:1.6">
      Local mode has no real SMTP. The reset link is printed in the Node-RED log.
    </p>

    <div class="auth-links">
      <a href="login.html">Back to login</a>
      <span></span>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
document.getElementById("forgotForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  const btn = document.getElementById("submitBtn");
  btn.disabled = true;

  try {
    const res = await fetch(API_BASE + "/api/auth/forgot-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: document.getElementById("email").value.trim() }),
    });
    const data = await res.json();
    msg.textContent = data.message || "Request sent";
    msg.className = "auth-msg success";
  } catch (err) {
    msg.textContent = "Could not connect to Node-RED (" + API_BASE + ")";
    msg.className = "auth-msg error";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
